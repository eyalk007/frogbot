# Frogbot Security Scan - GitLab CI Component
#
# Usage:
#   include:
#     - component: $CI_SERVER_FQDN/jfrog/frogbot/frogbot@v3
#
# Or for gitlab.com:
#   include:
#     - component: gitlab.com/jfrog/frogbot/frogbot@v3
#
# Set these variables in GitLab (Settings → CI/CD → Variables):
#   - JF_URL (your JFrog instance URL)
#   - JF_ACCESS_TOKEN (JFrog access token, mark as Masked)
#   - JF_GIT_TOKEN (GitLab access token, mark as Masked)
#
# This will:
#   - Scan pull requests automatically
#   - Scan main branch on every push
#   - Scan on scheduled pipelines
#
# Optional - Add custom Frogbot configuration:
#   variables:
#     JF_MIN_SEVERITY: "high"
#     JF_WATCHES: "my-watch"
#     JF_FIXABLE_ONLY: "TRUE"
#
# Optional - Customize when jobs run:
#   frogbot-pr:
#     rules:
#       - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
#         when: manual
#
# Optional - Use custom Docker image:
#   frogbot-pr:
#     image: my-company/custom-image:tag
#
# For air-gapped environments, host this component internally

spec:
  inputs:
    stage:
      default: test
      description: "Pipeline stage to run Frogbot in"
---

# Scans pull requests automatically
frogbot-pr:
  stage: $[[ inputs.stage ]]
  image: releases-docker.jfrog.io/jfrog-ecosystem-integration-env
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    JF_GIT_PROVIDER: "gitlab"
    JF_GIT_OWNER: $CI_PROJECT_NAMESPACE
    JF_GIT_REPO: $CI_PROJECT_NAME
    JF_GIT_API_ENDPOINT: $CI_API_V4_URL
    JF_GIT_PULL_REQUEST_ID: $CI_MERGE_REQUEST_IID
    JF_GIT_BASE_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    FROGBOT_CMD: "scan-pull-request"
  script:
    - |
      curl -fLg "https://releases.jfrog.io/artifactory/frogbot/v2/[RELEASE]/getFrogbot.sh" | sh
      ./frogbot $FROGBOT_CMD

# Scans repository on main branch pushes and scheduled scans
frogbot-repo:
  stage: $[[ inputs.stage ]]
  image: releases-docker.jfrog.io/jfrog-ecosystem-integration-env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    JF_GIT_PROVIDER: "gitlab"
    JF_GIT_OWNER: $CI_PROJECT_NAMESPACE
    JF_GIT_REPO: $CI_PROJECT_NAME
    JF_GIT_API_ENDPOINT: $CI_API_V4_URL
    JF_GIT_PULL_REQUEST_ID: $CI_MERGE_REQUEST_IID
    JF_GIT_BASE_BRANCH: $CI_COMMIT_BRANCH
    FROGBOT_CMD: "scan-repository"
  script:
    - |
      curl -fLg "https://releases.jfrog.io/artifactory/frogbot/v2/[RELEASE]/getFrogbot.sh" | sh
      ./frogbot $FROGBOT_CMD

